name: Browser CI

on:
  pull_request:
  push:
    branches: [main]
    paths: [src/**, ui/**, scripts/**, manifest.toml, .github/workflows/ci.yml]

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap mmdebstrap squashfs-tools debian-archive-keyring
      - name: Build, smoke test, and package
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo ./scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gizlet-browser-arm64
          path: dist/*.gzl
          if-no-files-found: error

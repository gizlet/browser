name: CI

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request to run for; leave empty to run on the selected branch.
        required: false
        default: ''
        type: string
      head_sha:
        description: Expected pull-request head; a moved head is skipped.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  start:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '')
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && contains(github.event.comment.body, '/ci'))
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: gizlet/.github/.github/workflows/pr-check-start.yml@latest
    with:
      check-name: CI
      command: /ci
      pull_request_number: ${{ inputs.pull_request_number }}
      head_sha: ${{ inputs.head_sha }}

  arm64:
    name: Build and package (ARM64)
    needs: start
    if: >-
      !cancelled() && (
        needs.start.outputs.run == 'true'
        || (needs.start.result == 'skipped' && github.event_name != 'issue_comment'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: ci-${{ needs.start.outputs.number || github.run_id }}
      cancel-in-progress: ${{ needs.start.outputs.number != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.start.outputs.head_sha || github.sha }}
          persist-credentials: false
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap mmdebstrap squashfs-tools debian-archive-keyring
      - name: Build, smoke test, and package
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo ./scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gizlet-browser-arm64
          path: dist/*.gzl
          if-no-files-found: error
          overwrite: true

  release:
    needs: arm64
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag'))
      || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.pull_request_number == '')
    permissions:
      contents: write
      id-token: write
    uses: gizlet/.github/.github/workflows/store-release.yml@latest
    with:
      artifact-name: gizlet-browser-arm64

  finish:
    needs: [start, arm64]
    if: always() && needs.start.outputs.run == 'true'
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: gizlet/.github/.github/workflows/pr-check-finish.yml@latest
    with:
      check_run_id: ${{ needs.start.outputs.check_run_id }}
      comment_id: ${{ needs.start.outputs.comment_id }}
      result: ${{ needs.arm64.result }}

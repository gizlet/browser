<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'">
<title>Gizlet Browser</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, "Noto Sans CJK SC", sans-serif; color: #faf7ff; background: #181522; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: #181522; }
  main { padding: 14px 14px 0; }
  h1 { margin: 0 0 10px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; color: #cdbde6; }
  input { width: 100%; font: inherit; font-size: 20px; color: inherit; background: #110d19; border: 2px solid #c9affc; border-radius: 9px; padding: 9px 12px; outline: none; caret-color: #f9e28b; }
  input::placeholder { color: #a996c2; }
  input::selection { background: #5b4683; }
  dl { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 5px 10px; margin: 11px 2px 0; font-size: 13px; color: #cdbde6; }
  dt { font-weight: 700; color: #faf7ff; }
  dd { margin: 0; }
  [data-lang="zh"] [lang="en"], [data-lang="en"] [lang="zh-CN"], :root:not([data-lang]) [lang="zh-CN"] { display: none; }
</style>
<main>
  <h1>Gizlet Browser</h1>
  <input id="address" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" inputmode="url"
         placeholder="Address or search" aria-label="Address or search">
  <dl lang="en"><dt>D-pad</dt><dd>Move between links</dd><dt>A</dt><dd>Open or type</dd><dt>B</dt><dd>Back</dd><dt>Start</dt><dd>Forward</dd><dt>X</dt><dd>Address</dd><dt>Y</dt><dd>Reload</dd><dt>L1 / R1</dt><dd>Page up / down</dd><dt>L2 / R2</dt><dd>Zoom</dd><dt>Left stick</dt><dd>Pointer</dd><dt>Right stick</dt><dd>Scroll</dd></dl>
  <dl lang="zh-CN"><dt>方向键</dt><dd>在链接间移动</dd><dt>A</dt><dd>打开或输入</dd><dt>B</dt><dd>返回</dd><dt>Start</dt><dd>前进</dd><dt>X</dt><dd>地址栏</dd><dt>Y</dt><dd>重新加载</dd><dt>L1 / R1</dt><dd>上 / 下翻页</dd><dt>L2 / R2</dt><dd>缩放</dd><dt>左摇杆</dt><dd>鼠标指针</dd><dt>右摇杆</dt><dd>滚动页面</dd></dl>
</main>
<script>
  const address = document.getElementById("address");
  const current = new URLSearchParams(location.search).get("u");
  if (current) address.value = current;
  if (document.documentElement.dataset.lang === "zh") address.placeholder = "输入网址或搜索";
  new MutationObserver(() => {
    if (document.documentElement.dataset.lang === "zh") address.placeholder = "输入网址或搜索";
  }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-lang"] });
</script>
